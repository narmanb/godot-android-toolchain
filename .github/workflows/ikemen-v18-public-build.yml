name: IKEMEN Installer v1.8.1 Public Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ikemen-v18-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate v1.5 source
        run: python3 tools/patch_installer_v15.py

      - name: Generate v1.6 source
        run: python3 tools/patch_installer_v16.py

      - name: Generate v1.7 source
        run: python3 tools/patch_installer_v17.py

      - name: Generate v1.8 source
        run: python3 tools/patch_installer_v18.py

      - name: Generate v1.8.1 source
        run: python3 tools/patch_installer_v181.py

      - name: Verify v1.8.1 sources
        run: |
          grep -F "versionName '1.8.1'" app/build.gradle
          grep -F 'InstallerActivityV181' app/src/main/AndroidManifest.xml
          grep -F 'Install ONE ZIP / RAR / 7Z character' app/src/main/java/com/narmanb/ikemeninstaller/InstallerActivityV181.java
          grep -F 'Remove installed character' app/src/main/java/com/narmanb/ikemeninstaller/InstallerActivityV181.java
          grep -F 'canonicalRosterEntry' app/src/main/java/com/narmanb/ikemeninstaller/InstallerActivityV181.java
          grep -F 'SevenZFile' app/src/main/java/com/narmanb/ikemeninstaller/InstallerActivityV181.java
          grep -F 'Deep-scan installed command lists' app/src/main/java/com/narmanb/ikemeninstaller/InstallerActivityV181.java
          grep -F 'Do not MIME-filter archives here' app/src/main/java/com/narmanb/ikemeninstaller/InstallerActivityV181.java
          if grep -F 'Intent.EXTRA_MIME_TYPES' app/src/main/java/com/narmanb/ikemeninstaller/InstallerActivityV181.java; then exit 1; fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IKEMEN-Content-Installer-v1.8.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKEMEN-Content-Installer-v1.8.1
          path: ikemen-v18-build/IKEMEN-Content-Installer-v1.8.1.apk
          if-no-files-found: error
