name: Delete Actions Artifacts Only
on:
  push:
    paths: ['.github/workflows/cleanup-actions-storage-8d-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  delete-artifacts-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete Actions artifacts only
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 120; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: context.sha, per_page: 100
              });
              const active = runs.filter(r => r.id !== context.runId && r.status !== 'completed');
              if (active.length === 0) break;
              console.log(`Waiting for ${active.length} other run(s) from this commit to finish...`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            let deletedCount = 0;
            let deletedBytes = 0;
            for (const artifact of artifacts) {
              if (artifact.expired) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              deletedCount++;
              deletedBytes += artifact.size_in_bytes || 0;
            }
            const remaining = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            const live = remaining.filter(a => !a.expired);
            const remainingBytes = live.reduce((sum, a) => sum + (a.size_in_bytes || 0), 0);
            console.log(`ARTIFACT_ONLY_CLEANUP deleted_count=${deletedCount} deleted_bytes=${deletedBytes} remaining_count=${live.length} remaining_bytes=${remainingBytes}`);
