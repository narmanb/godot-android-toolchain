name: Build reusable Godot Android toolchain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download pinned official Godot 4.7.2
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --version

      - name: Download and install pinned export templates
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz' | sha256sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"

      - name: Install Android SDK components
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" --version
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Configure Godot Android editor settings
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Clean-import canary
        run: |
          set -euxo pipefail
          rm -rf canary/.godot dist
          mkdir -p dist
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path canary --editor --quit
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path canary --quit-after 1 | tee /tmp/canary.log
          grep -F 'GODOT_ANDROID_TOOLCHAIN_CANARY_OK' /tmp/canary.log

      - name: Export and validate canary APK
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path canary --export-debug Android "$GITHUB_WORKSPACE/dist/toolchain-canary.apk"
          test -s dist/toolchain-canary.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/toolchain-canary.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/toolchain-canary.apk

      - name: Package reusable local toolchain
        run: |
          set -euxo pipefail
          mkdir -p bundle/godot bundle/export_templates bundle/android-sdk bundle/meta
          cp "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" bundle/godot/godot
          cp -a "$HOME/.local/share/godot/export_templates/4.7.2.stable/." bundle/export_templates/
          cp -a "$ANDROID_HOME/platform-tools" bundle/android-sdk/
          cp -a "$ANDROID_HOME/platforms/android-35" bundle/android-sdk/platforms-android-35
          cp -a "$ANDROID_HOME/build-tools/35.0.0" bundle/android-sdk/build-tools-35.0.0
          printf 'Godot 4.7.2 stable\nJava 21 required\nAndroid platform 35\nAndroid build-tools 35.0.0\n' > bundle/meta/VERSIONS.txt
          sha256sum bundle/godot/godot bundle/export_templates/android_debug.apk bundle/export_templates/android_release.apk > bundle/meta/SHA256SUMS.txt
          cp dist/toolchain-canary.apk bundle/meta/

      - name: Upload reusable toolchain
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-android-local-toolchain
          path: bundle
          if-no-files-found: error
          retention-days: 30
